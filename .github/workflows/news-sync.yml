# News sync: refresh the Pocket Fishing Guide "What's new" snapshot and rebuild /news/ and the
# lab block, then open a pull request for human review. Nothing is pushed to main.
#
# Why a schedule: Pocket Fishing Guide tags a release every day it ships an angler-visible
# change and the Friday digest goes out Friday morning. Running Friday at 15:40 UTC (10:40 CT)
# means the week's changes are in the PR before the Friday note is written. One run a week,
# a few seconds of Actions minutes.
#
# No token: the app serves its What's new file publicly at
# https://www.pocketfishinguide.com/data/whats-new.json (pocket-fishing-guide
# web/public/data/whats-new.json, byte-identical to data/whats-new.json by its validator), the
# same text anglers read at /whats-new. A 404 there means the PFG side has not deployed the
# public copy yet; the run stops and says so.
#
# Repo setting: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests" must be on for the gh pr create step.
#
# Runbook: docs/NEWS-AND-UPDATES.md
name: News sync

on:
  schedule:
    - cron: "40 15 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch the What's new snapshot from pocketfishinguide.com
        run: |
          set -euo pipefail
          URL="https://www.pocketfishinguide.com/data/whats-new.json"
          TMP="$(mktemp)"
          CODE="$(curl -sS -L --max-time 30 -o "$TMP" -w '%{http_code}' -H 'Accept: application/json' -H 'User-Agent: twt-news-sync (+https://talewatersandtides.com/news/)' "$URL")"
          if [ "$CODE" != "200" ]; then
            echo "::error::$URL answered $CODE. The public copy is web/public/data/whats-new.json in pocket-fishing-guide; it must be deployed before this sync can run."
            exit 1
          fi
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!Array.isArray(j.entries)||!Array.isArray(j.areas)||!j.entries.length) throw new Error("unexpected shape"); console.log(j.entries.length+" entries, newest "+j.entries[0].date)' "$TMP"
          mv "$TMP" data/pfg-whats-new.json
          SHA="$(sha256sum data/pfg-whats-new.json | cut -c1-64)"
          node -e '
            const fs=require("fs"); const p="data/news.json"; const j=JSON.parse(fs.readFileSync(p,"utf8"));
            j.pfg_snapshot.synced_at=new Date().toISOString().slice(0,10); j.pfg_snapshot.sha256=process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");' "$SHA"
          echo "sha256 $SHA"

      - name: Rebuild the news page, feed and lab block
        run: node scripts/build-news.mjs

      - name: Checks
        run: |
          npx --yes htmlhint@1 "news/*.html" "lab/*.html"
          node scripts/check-site.mjs
          node scripts/build-news.mjs --check

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/ news/ lab/; then
            echo "Nothing changed since the last sync."
            exit 0
          fi
          NEWEST="$(node -e 'console.log(require("./data/pfg-whats-new.json").entries[0].date)')"
          BRANCH="chore/news-sync-$NEWEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The lease is explicit: the branch's current remote tip, or empty on the first run
          # (empty means "expect no such branch"). A bare --force-with-lease would read a
          # remote-tracking ref this single-branch checkout never has, and reject a same-day
          # rerun as stale.
          EXPECTED="$(git ls-remote --heads origin "$BRANCH" | cut -f1)"
          git checkout -B "$BRANCH"
          git add data/ news/ lab/
          git commit -m "[Chore] News sync: Pocket Fishing Guide changes through $NEWEST"
          git push -u origin "$BRANCH" --force-with-lease="$BRANCH:$EXPECTED"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR for $BRANCH already open; updated its branch."
          else
            gh pr create --draft --base main --head "$BRANCH" \
              --title "[Chore] News sync: Pocket Fishing Guide changes through $NEWEST" \
              --body "$(printf '%s\n' \
                "Automated weekly sync (news-sync.yml)." \
                "" \
                "- data/pfg-whats-new.json refreshed from https://www.pocketfishinguide.com/data/whats-new.json" \
                "- news/index.html, news/feed.xml and the lab block regenerated by scripts/build-news.mjs" \
                "" \
                "Before merging: write this week's Friday note and the metrics in data/news.json, run node scripts/build-news.mjs, and read the page at phone width. Runbook: docs/NEWS-AND-UPDATES.md.")"
          fi
