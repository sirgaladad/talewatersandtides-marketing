name: Workflow lint

# actionlint checks every workflow for expression, syntax and injection mistakes (an
# untrusted `${{ github.head_ref }}` inline in a shell script, an unknown input, a typo in
# `needs`). Runs only when a workflow changes, so it costs nothing on most PRs.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        # Pinned release, verified against its published SHA-256 before it runs.
        env:
          VERSION: "1.7.7"
          SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color -shellcheck=
