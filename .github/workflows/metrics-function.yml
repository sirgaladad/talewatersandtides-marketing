# Type-check, lint, and unit-test the Supabase `metrics` Edge Function, and make
# sure the committed sample payload matches what the fixture builds today.
# Deploys are manual (`supabase functions deploy metrics`); this is the gate before a merge.
name: Metrics function

on:
  pull_request:
    paths:
      - "supabase/functions/metrics/**"
      - "admin/metrics/**"
      - ".github/workflows/metrics-function.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/metrics/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-function-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/metrics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        run: deno lint
      - name: Type-check
        run: deno check index.ts fixture.ts
      - name: Unit tests
        run: deno test --no-check=remote --allow-env metrics_test.ts
      - name: Sample payload is current
        run: deno run fixture.ts | diff - ../../../admin/metrics/sample.json
