# Lint every HTML page with HTMLHint (rules in .htmlhintrc).
# The site has no build step, so this is the only automated quality gate
# before a merge to main triggers the GitHub Pages deploy.
name: HTML lint

on:
  pull_request:
    paths:
      - "**/*.html"
      - ".htmlhintrc"
      - ".github/workflows/html-lint.yml"
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - ".htmlhintrc"
      - ".github/workflows/html-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run HTMLHint
        run: npx --yes htmlhint@1 "**/*.html"
