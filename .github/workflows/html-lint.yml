# Lint every HTML page with HTMLHint (rules in .htmlhintrc), then run the
# SEO and internal-link checks in scripts/check-site.mjs.
# scripts/build-news.mjs --check fails when news/ or the lab block was not regenerated
# after a change to data/news.json or data/pfg-whats-new.json.
# The site has no build step, so this is the only automated quality gate
# before a merge to main triggers the GitHub Pages deploy.
name: HTML lint

on:
  pull_request:
    paths:
      - "**/*.html"
      - ".htmlhintrc"
      - "sitemap.xml"
      - "scripts/check-site.mjs"
      - "scripts/build-news.mjs"
      - "data/**"
      - "scripts/check-design.mjs"
      - "design/**"
      - ".github/workflows/html-lint.yml"
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - ".htmlhintrc"
      - ".github/workflows/html-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run HTMLHint
        run: npx --yes htmlhint@1 "**/*.html" --ignore "design/**"
      - name: Design package checks
        run: node scripts/check-design.mjs
      - name: SEO and link checks (sitemap pages)
        run: node scripts/check-site.mjs
      - name: News page, feed and lab block are current
        run: node scripts/build-news.mjs --check
