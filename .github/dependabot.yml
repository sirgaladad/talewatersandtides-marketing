# Keeps the GitHub Actions in these workflows current. The site has no package manifest,
# so Actions are the only dependency to track. Monthly and grouped: one small PR.
# Security alerts need "Dependabot alerts" switched on in repo settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
